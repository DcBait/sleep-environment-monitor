[package]
name = "sleep-subscriber"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sleep-subscriber"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
